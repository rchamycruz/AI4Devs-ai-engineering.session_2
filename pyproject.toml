[project]
name = "estimador-cag"
version = "0.1.0"
description = "Servicio FastAPI que genera estimaciones de software a partir de transcripciones de reuniones usando CAG"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.9.0",
    "fastapi>=0.142.1",
    "openai>=3.22.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.54.0",
]
